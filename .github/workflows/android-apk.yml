name: Android test APK
on:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify new test APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='app.dolemon.mobile' versionCode='4' versionName='1.3.0'"
          sha256sum "$APK"
          echo "Upload this file to public/downloads/dolemon-test-1.3.0.apk after downloading the artifact."
      - name: Verify the published APK when it is already in the tree
        run: |
          APK=public/downloads/dolemon-test-1.3.0.apk
          if [ ! -f "$APK" ]; then echo "Not published yet — the artifact below is the build to publish."; exit 0; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='app.dolemon.mobile' versionCode='4' versionName='1.3.0'"
      - uses: actions/upload-artifact@v4
        with:
          name: Dolemon-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
