name: Android test APK
on:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify new test APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          sha256sum "$APK"
      # Temporary export while artifact downloads are unavailable in the sandbox.
      - name: Export build metadata and APK blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          node -e 'const fs=require("fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/apkblob.json",JSON.stringify({content:fs.readFileSync(process.argv[1]).toString("base64"),encoding:"base64"}))' "$APK"
          BLOB=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/apkblob.json" --jq .sha)
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "::notice title=Verified APK export::blob=$BLOB sha256=$HASH cert=$CERT"
      - uses: actions/upload-artifact@v4
        with:
          name: Dolemon-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
