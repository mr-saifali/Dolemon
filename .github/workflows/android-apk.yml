name: Android test APK
on:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify new test APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='app.dolemon.mobile' versionCode='4' versionName='1.3.0'"
          sha256sum "$APK"
          echo "Upload this file to public/downloads/dolemon-test-1.3.0.apk after downloading the artifact."
      - name: Verify the published APK when it is already in the tree
        run: |
          APK=public/downloads/dolemon-test-1.3.0.apk
          if [ ! -f "$APK" ]; then echo "Not published yet — the artifact below is the build to publish."; exit 0; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='app.dolemon.mobile' versionCode='4' versionName='1.3.0'"
      - name: Publish the test APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          VERSION=$(sed -n "s/.*versionName '\([0-9.]*\)'.*/\1/p" android/app/build.gradle | head -1)
          TARGET="public/downloads/dolemon-test-${VERSION}.apk"
          if [ -z "$VERSION" ]; then echo "No versionName in android/app/build.gradle"; exit 1; fi
          # A rebuilt APK is byte-different (fresh debug key, new timestamps). Once a
          # version is published it stays the file people already downloaded.
          if [ -f "$TARGET" ]; then
            echo "$TARGET is already published ($(sha256sum "$TARGET" | cut -d' ' -f1)); bump versionName to ship a new build."
            exit 0
          fi
          cp "$APK" "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$TARGET"
          if git diff --cached --quiet; then echo "$TARGET is already current"; exit 0; fi
          git commit -m "chore(android): publish ${VERSION} test APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: Dolemon-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
