<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Offline — Dolemon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #09090b; color: #f5f5f7; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 360px); text-align: center; }
    .icon { font-size: 32px; }
    h1 { font-size: 24px; letter-spacing: -.03em; margin: 14px 0 8px; }
    p { color: #b5b5bf; margin: 0 0 16px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 14px; background: #ff5c7a; color: #160a0d; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    small { display: block; color: #8e8e93; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">☁</div>
    <h1>Can't connect right now</h1>
    <p>Check your connection and try again. This page can appear when the network is slow or unavailable.</p>
    <a href="">Try again</a>
    <small>Remote messages and calls need a connection. Unsent messages aren't queued for later delivery.</small>
  </main>
</body>
</html>
